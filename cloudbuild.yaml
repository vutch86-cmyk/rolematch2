# Google Cloud Build Pipeline for RoleMatch 2 (Staging Branch)
# This file is used if triggering builds directly via Google Cloud Build.

steps:
  # -------------------------------------------------------------
  # Step 1: Build Docker image with multi-stage Dockerfile
  # -------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-image'

  # -------------------------------------------------------------
  # Step 2: Push container image to Google Artifact Registry
  # -------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}'
    id: 'push-image'

  # -------------------------------------------------------------
  # Step 3: Deploy revision to Google Cloud Run
  # -------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080,ENABLE_TEST_USER_SEED=true'
    id: 'deploy-cloud-run'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'

substitutions:
  _REGION: 'asia-southeast1'
  _AR_REPO: 'rolematch'
  _SERVICE_NAME: 'rolematch-staging'

options:
  logging: CLOUD_LOGGING_ONLY
